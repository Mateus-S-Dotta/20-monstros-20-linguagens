services:
  asm-vm:
    build: .
    container_name: asm-vm-dev
    volumes:
      - ./:/app
    working_dir: /app
    stdin_open: true   # equivalente ao -i
    tty: true          # equivalente ao -t
    # gdb precisa disso pra funcionar dentro do container (ptrace)
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
 
